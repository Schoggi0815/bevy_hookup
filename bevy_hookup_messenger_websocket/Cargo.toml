[package]
name = "bevy_hookup_messenger_websocket"
version = "2.8.0"
edition = "2024"
description = "The websocket messenger of the bevy_hookup library"
readme = "./README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Schoggi0815/bevy_hookup"

[dependencies]
bevy = "0.19.1"
bevy_hookup_core = { path = "../bevy_hookup_core", version = "5.4.0"}
bincode = { version = "2.0.1", features = ["serde"] }
crossbeam = "0.8.4"
futures-util = "0.3.34"
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["full"]}
tokio-tungstenite = "0.30.0"
