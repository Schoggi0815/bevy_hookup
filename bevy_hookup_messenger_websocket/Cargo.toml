[package]
name = "bevy_hookup_messenger_websocket"
version = "3.2.0"
edition = "2024"
description = "The websocket messenger of the bevy_hookup library"
readme = "./README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Schoggi0815/bevy_hookup"
keywords = ["bevy", "multiplayer", "networking"]
categories = ["game-development", "network-programming"]

[dependencies]
bevy = "0.20.1"
bevy_hookup_core = { path = "../bevy_hookup_core", version = "6.2.1" }
postcard = "1.1.3"
crossbeam = "0.8.5"
futures-util = "0.3.34"
serde = "1.0.229"
tokio = { version = "1.54.1", features = ["sync", "rt", "rt-multi-thread", "time"]}
tokio_with_wasm = { version = "0.9.2", features = ["sync", "rt", "rt-multi-thread", "time"] }
tokio-tungstenite-wasm = "0.9.0"
tokio-tungstenite = { version = "0.29.0", optional = true }
erased-serde = "0.4.11"
anyhow = "1.0.104"

[features]
default = ["servers"]
servers = ["dep:tokio-tungstenite", "tokio/macros"]

